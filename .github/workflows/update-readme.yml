name: Metrics
on:
  # Refresh once a day
  schedule: [{cron: "0 0 * * *"}]
  # Refresh on every push to main
  push: {branches: ["main"]}
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
jobs:

  # ────────────────────────────────────────────────────────────────
  # Core dashboard: header, activity, community, repositories, metadata
  # ────────────────────────────────────────────────────────────────
  core-metrics:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.core.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories, metadata
          plugin_introduction: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          config_timezone: Asia/Karachi

  # ────────────────────────────────────────────────────────────────
  # Activity, calendar, traffic, notable contributions, follow-ups
  # ────────────────────────────────────────────────────────────────
  activity-metrics:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_calendar: yes
          plugin_traffic: yes
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_followup: yes
          plugin_followup_sections: repositories, issues, prs
          config_timezone: Asia/Karachi

  # ────────────────────────────────────────────────────────────────
  # Community: discussions, people, contributors, reactions
  # ────────────────────────────────────────────────────────────────
  community-metrics:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.community.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_discussions: yes
          plugin_people: yes
          plugin_people_size: 14
          plugin_contributors: yes
          plugin_reactions: yes
          plugin_reactions_limit: 4

  # ────────────────────────────────────────────────────────────────
  # Repositories: stars, stargazers, star lists, topics, licenses, languages
  # ────────────────────────────────────────────────────────────────
  repositories-metrics:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.repositories.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_starlists: yes
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_licenses: yes
          plugin_licenses_target: repositories
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: bytes-size, percentage

  # ────────────────────────────────────────────────────────────────
  # Coding habits (recent commit/diff patterns)
  # ────────────────────────────────────────────────────────────────
  habits-metrics:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_timezone: Asia/Karachi

  # ────────────────────────────────────────────────────────────────
  # GitHub Skyline (3D contributions render)
  # ────────────────────────────────────────────────────────────────
  skyline-metrics:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.skyline.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 2025

  # ────────────────────────────────────────────────────────────────
  # Social: Leetcode + Steam
  # Replace the placeholder usernames below with your own.
  # ────────────────────────────────────────────────────────────────
  social-metrics:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.social.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_leetcode: yes
          plugin_leetcode_user: YOUR_LEETCODE_USERNAME
          plugin_leetcode_sections: heatmap, ranking, stats
          plugin_steam: yes
          plugin_steam_user: ${{ secrets.STEAM_ID }}
          plugin_steam_key: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_sections: recent, badges

  # ────────────────────────────────────────────────────────────────
  # Community plugin: 16personalities (MBTI)
  # Requires a "share profile" link, generated after taking the test at
  # https://www.16personalities.com — store it as the SIXTEEN_PERSONALITIES_URL secret.
  # ────────────────────────────────────────────────────────────────
  personality-metrics:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.16personalities.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          setup_community_templates: lowlighter/metrics@master:community
          plugin_16personalities: yes
          plugin_16personalities_url: ${{ secrets.SIXTEEN_PERSONALITIES_URL }}
          plugin_16personalities_sections: personality, traits
          plugin_16personalities_scores: yes
