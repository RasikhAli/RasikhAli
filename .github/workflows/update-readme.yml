name: Update README with Latest Repos

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch latest repos & build section
        run: |
          echo "Fetching latest repositories..."

          RESPONSE=$(curl -s -w "%{http_code}" "https://api.github.com/users/RasikhAli/repos?per_page=100")
          HTTP_CODE="${RESPONSE: -3}"
          BODY="${RESPONSE%???}"

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "GitHub API failed"
            exit 1
          fi

          echo "$BODY" | jq '.' > /dev/null

          echo "$BODY" | jq -r '
            map(select(.name != "RasikhAli"))
            | sort_by(.updated_at)
            | reverse
            | .[0:5][]
          ' > repos.json

          OUTPUT=""

          while read -r row; do
            NAME=$(echo "$row" | jq -r '.name')
            DESC=$(echo "$row" | jq -r '.description // "No description provided"')
            URL=$(echo "$row" | jq -r '.html_url')
            LANG=$(echo "$row" | jq -r '.language // "N/A"')

            OUTPUT="${OUTPUT}### 📌 ${NAME}

            ${DESC}
            
            **Tech Stack:** ${LANG}
            
            🔗 GitHub Repository: ${URL}
            
            ---

            "
          done < repos.json

          echo "Generated section:"
          echo "$OUTPUT"

          awk -v new="$OUTPUT" '
          BEGIN {p=1}
          /<!-- LATEST_REPOS_START -->/ {
            print;
            printf "%s", new;
            p=0;
            next;
          }
          /<!-- LATEST_REPOS_END -->/ {
            p=1;
          }
          p
          ' README.md > temp.md && mv temp.md README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "🔄 Update latest repositories" || echo "No changes"
          git push
